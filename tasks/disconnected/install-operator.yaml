apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: disconnected-install-operator
spec:
  description: 'Install RHCL operator from generated disconnected install manifests'
  params:
    - name: kubeconfig-path
      type: string
  steps:
    - name: install-operator
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
      timeout: 30m
      env:
        - name: KUBECONFIG
          value: $(params.kubeconfig-path)
        - name: WORK_DIR
          value: $(workspaces.shared-workspace.path)/disconnected-install
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        INSTALL_SCRIPT="${WORK_DIR}/install/install.sh"

        if [ ! -f "$INSTALL_SCRIPT" ]; then
            echo "ERROR: Install script not found at ${INSTALL_SCRIPT}"
            echo "  The setup-disconnected task must run first to generate install manifests."
            ls -la "${WORK_DIR}/" 2>/dev/null || echo "  Work directory does not exist."
            exit 1
        fi

        echo "==> Running generated install script"
        chmod +x "$INSTALL_SCRIPT"
        bash "$INSTALL_SCRIPT"
  workspaces:
    - name: shared-workspace
