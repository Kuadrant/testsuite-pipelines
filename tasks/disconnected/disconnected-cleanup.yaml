apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: disconnected-cleanup
spec:
  description: 'Reconnect cluster and clean up all disconnected install resources'
  params:
    - name: kubeconfig-path
      type: string
  steps:
    - name: reconnect
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
      timeout: 15m
      env:
        - name: KUBECONFIG
          value: $(params.kubeconfig-path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "==> Reconnecting cluster to external network"

        NODE_NAMES=$(oc get nodes -o name | cut -d'/' -f2)

        if [ -z "$NODE_NAMES" ]; then
            echo "WARNING: Could not find any nodes (skipping reconnect)"
            exit 0
        fi

        NODE_COUNT=$(echo "$NODE_NAMES" | wc -l)
        echo "  Nodes (${NODE_COUNT}):"
        for NODE_NAME in $NODE_NAMES; do
            echo "    - ${NODE_NAME}"
        done
        echo ""

        NEEDS_RESTORE=false
        for NODE_NAME in $NODE_NAMES; do
            if ! oc debug -n default node/${NODE_NAME} -- chroot /host timeout 5 curl -I https://quay.io 2>/dev/null > /dev/null 2>&1; then
                NEEDS_RESTORE=true
                break
            fi
        done

        if [ "$NEEDS_RESTORE" = false ]; then
            echo "  All nodes already connected to external network"
            exit 0
        fi

        echo "  Disconnected nodes detected - restoring connectivity..."

        for NODE_NAME in $NODE_NAMES; do
            echo "  Restoring node: ${NODE_NAME}..."
            oc debug -n default node/${NODE_NAME} -- chroot /host /bin/bash -c "
                if [ -f /tmp/iptables-before-disconnect.rules ]; then
                    iptables-restore < /tmp/iptables-before-disconnect.rules
                    rm -f /tmp/iptables-before-disconnect.rules
                    echo '    Original iptables rules restored'
                else
                    iptables -F OUTPUT
                    iptables -P OUTPUT ACCEPT
                    echo '    iptables OUTPUT chain flushed (default ACCEPT policy)'
                fi
            " 2>/dev/null || echo "    WARNING: Failed to restore iptables on ${NODE_NAME}"
        done

        sleep 2
        RECONNECT_OK=true
        for NODE_NAME in $NODE_NAMES; do
            if ! oc debug -n default node/${NODE_NAME} -- chroot /host timeout 5 curl -I https://quay.io 2>/dev/null > /dev/null 2>&1; then
                echo "  WARNING: ${NODE_NAME} may still be disconnected"
                RECONNECT_OK=false
            fi
        done

        if [ "$RECONNECT_OK" = true ]; then
            echo "  All nodes reconnected to external network"
        else
            echo "  WARNING: Some nodes may still be disconnected"
        fi
        echo ""
    - name: cleanup
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
      timeout: 45m
      env:
        - name: KUBECONFIG
          value: $(params.kubeconfig-path)
        - name: WORK_DIR
          value: $(workspaces.shared-workspace.path)/disconnected-install
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        MIRROR_NAMESPACE="mirror-registry"

        echo "==> Cleanup Disconnected Installation Test Resources"
        echo ""

        if ! oc whoami &>/dev/null; then
            echo "OpenShift cluster not accessible (skipping cluster cleanup)"
            # Still clean local files
            if [ -d "$WORK_DIR" ]; then
                rm -rf "$WORK_DIR"
                echo "Removed ${WORK_DIR}"
            fi
            exit 0
        fi

        echo "OpenShift cluster accessible"
        echo ""

        # Find and remove Kuadrant disconnected test CatalogSources
        echo "==> Removing CatalogSources"
        CATALOG_NAMES=$(oc get catalogsource -n openshift-marketplace -l kuadrant.io/disconnected-test=true -o name 2>/dev/null | \
            cut -d'/' -f2 || echo "")

        if [ -n "$CATALOG_NAMES" ]; then
            for catalog_name in ${CATALOG_NAMES}; do
                echo "  Removing: ${catalog_name}"
                oc delete catalogsource ${catalog_name} -n openshift-marketplace --ignore-not-found=true
            done
        else
            echo "  No Kuadrant CatalogSources found"
        fi

        # Remove kuadrant-system namespace
        echo ""
        echo "==> Removing kuadrant-system namespace"
        if oc get namespace kuadrant-system &>/dev/null; then
            if [ -f "${WORK_DIR}/install/uninstall.sh" ]; then
                echo "  Running automated uninstall script..."
                chmod +x "${WORK_DIR}/install/uninstall.sh"
                bash "${WORK_DIR}/install/uninstall.sh" || true
            fi
            # Ensure namespace resources are cleaned up even if uninstall script partially failed
            oc delete subscription --all -n kuadrant-system --ignore-not-found=true 2>/dev/null || true
            oc delete csv --all -n kuadrant-system --ignore-not-found=true 2>/dev/null || true
            oc delete operatorgroup --all -n kuadrant-system --ignore-not-found=true 2>/dev/null || true
            oc wait --for=delete pod --all -n kuadrant-system --timeout=60s 2>/dev/null || true
            oc delete namespace kuadrant-system --ignore-not-found=true --timeout=120s 2>/dev/null || true
            if oc get namespace kuadrant-system &>/dev/null 2>&1; then
                echo "  WARNING: kuadrant-system namespace still exists (may have stuck finalizers)"
            else
                echo "  Removed kuadrant-system namespace"
            fi
        else
            echo "  Namespace kuadrant-system not found"
        fi

        # Remove cluster-scoped mirror resources (IDMS/ITMS/ICSP) created by this test.
        echo ""
        echo "==> Removing image mirror resources created by this test"
        CLEANUP_MANIFEST="${WORK_DIR}/applied-cluster-resources.txt"
        MIRROR_REMOVED=false
        if [ -f "$CLEANUP_MANIFEST" ]; then
            while IFS= read -r resource; do
                [ -z "$resource" ] && continue
                echo "  Removing: ${resource}"
                oc delete "${resource}" --ignore-not-found=true 2>/dev/null || true
                MIRROR_REMOVED=true
            done < "$CLEANUP_MANIFEST"
            if [ "$MIRROR_REMOVED" = false ]; then
                echo "  Manifest is empty - no mirror resources to remove"
            fi
        else
            echo "  No cleanup manifest found at ${CLEANUP_MANIFEST}"
            echo "  Skipping (setup recorded no mirror resources; not using --all on a shared cluster)"
        fi

        # Wait for cluster to stabilize after removing mirror configuration
        if [ "$MIRROR_REMOVED" = true ]; then
            echo ""
            echo "==> Waiting for cluster to stabilize after removing image mirror configuration"

            NODE_COUNT=$(oc get nodes --no-headers 2>/dev/null | wc -l || echo "0")
            if [ "$NODE_COUNT" -eq 1 ]; then
                echo "  (Single-node cluster detected)"
            fi

            sleep 5

            WAIT_TIMEOUT=180
            APISERVER_STABLE=false
            START_TIME=$(date +%s)

            while [ $(($(date +%s) - START_TIME)) -lt $WAIT_TIMEOUT ]; do
                APISERVER_AVAILABLE=$(oc get co openshift-apiserver -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null)
                APISERVER_PROGRESSING=$(oc get co openshift-apiserver -o jsonpath='{.status.conditions[?(@.type=="Progressing")].status}' 2>/dev/null)

                if [ "$APISERVER_AVAILABLE" = "True" ] && [ "$APISERVER_PROGRESSING" = "False" ]; then
                    APISERVER_STABLE=true
                    echo "  Cluster stabilized"
                    break
                fi

                # Auto-fix stuck pods on single-node clusters
                if [ "$NODE_COUNT" -eq 1 ]; then
                    PENDING_PODS=$(oc get pods -n openshift-apiserver --no-headers 2>/dev/null | grep -c "Pending" || echo "0")
                    TERMINATING_PODS=$(oc get pods -n openshift-apiserver --no-headers 2>/dev/null | grep -c "Terminating" || echo "0")

                    if [ "$PENDING_PODS" -gt 0 ] && [ "$TERMINATING_PODS" -gt 0 ]; then
                        echo "  Auto-fixing stuck apiserver pods..."
                        oc get pods -n openshift-apiserver --no-headers 2>/dev/null | grep "Terminating" | awk '{print $1}' | while read pod; do
                            oc delete pod -n openshift-apiserver "$pod" --force --grace-period=0 2>/dev/null || true
                        done
                        sleep 10
                    fi
                fi

                sleep 5
            done

            if [ "$APISERVER_STABLE" = false ]; then
                echo "  WARNING: Cluster did not stabilize within ${WAIT_TIMEOUT}s (MachineConfig may still be updating)"
            fi
        fi

        # Remove mirror-registry namespace
        echo ""
        echo "==> Removing mirror-registry namespace"
        if oc get namespace ${MIRROR_NAMESPACE} &>/dev/null; then
            oc delete namespace ${MIRROR_NAMESPACE}
            echo "  Removed ${MIRROR_NAMESPACE} namespace"
        else
            echo "  Namespace ${MIRROR_NAMESPACE} not found"
        fi

        # Re-enable default OperatorHub sources
        echo ""
        echo "==> Checking OperatorHub default sources"
        SOURCES_DISABLED=$(oc get operatorhub cluster -o jsonpath='{.spec.disableAllDefaultSources}' 2>/dev/null || echo "false")

        if [ "$SOURCES_DISABLED" = "true" ]; then
            oc patch operatorhub cluster --type json \
                -p '[{"op": "replace", "path": "/spec/disableAllDefaultSources", "value": false}]'
            echo "  Default OperatorHub sources re-enabled"
        else
            echo "  Default OperatorHub sources already enabled"
        fi

        # Clean local files
        echo ""
        echo "==> Cleaning up workspace files"
        if [ -d "$WORK_DIR" ]; then
            rm -rf "$WORK_DIR"
            echo "  Removed ${WORK_DIR}"
        fi

        echo ""
        echo "Cleanup Complete"
  workspaces:
    - name: shared-workspace
