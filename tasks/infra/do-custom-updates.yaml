apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: do-custom-updates
spec:
  description: 'Allow for patching custom resources and other custom updates'
  params:
    - name: kubeconfig-path
      type: string
  steps:
    - name: do-custom-updates
      computeResources:
        limits:
          cpu: '100m'
          memory: 64Mi
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
      env:
        - name: KUBECONFIG
          value: $(params.kubeconfig-path)
      script: |
        #!/bin/bash
        set -euo pipefail

        # enable user workload monitoring
        kubectl apply -n openshift-monitoring -f -<<EOF
            apiVersion: v1
            kind: ConfigMap
            metadata:
                name: cluster-monitoring-config
                namespace: openshift-monitoring
            data:
                config.yaml: |
                    enableUserWorkload: true
        EOF

        # Copy the full ingress certificate chain in 'custom-cert' Secret, required for egress tests.
        source_secret=$(kubectl get ingresscontroller default -n openshift-ingress-operator -o jsonpath='{.spec.defaultCertificate.name}')
        source_secret=${source_secret:-router-certs-default}

        if [[ "$source_secret" != custom-cert ]]; then
          kubectl -n openshift-ingress get secret "$source_secret" -o json \
            | jq '{
                apiVersion: "v1",
                kind: "Secret",
                metadata: {
                  name: "custom-cert",
                  namespace: "openshift-ingress"
                },
                type: "kubernetes.io/tls",
                data: {"tls.crt": .data["tls.crt"], "tls.key": .data["tls.key"]}
              }' \
            | kubectl apply -f -
        fi
  workspaces:
    - name: shared-workspace
