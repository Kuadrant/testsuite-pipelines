apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: provision-ocp-aws
spec:
  description: 'Provisions OCP'
  params:
    - name: cluster-name
      type: string
    - name: installer-version
      type: string
    - name: region
      type: string
      default: "us-west-1"
    - name: master-size
      type: string
      default: "m6g.xlarge"
    - name: worker-size
      type: string
      default: "m6g.large"
    - name: installer-arch
      type: string
      default: "arm64"
  results:
    - name: kubeconfig-path
      description: Path to new kubeconfig in the workspace
    - name: kube-api
      description: API URL of the provisioned cluster
    - name: ocp-version
      description: OCP version that was installed
  workspaces:
    - name: shared-workspace
      description: "Shared workspace to persist cluster state files between tasks"
  steps:
    - computeResources:
        limits:
          cpu: '200m'
          memory: '1500Mi'
        requests:
          cpu: '100m'
          memory: '1000Mi'
      env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
      name: provision-aws-ocp
      script: |
        set -euo pipefail

        # Install osia
        python3.11 -m pip install --user "git+https://github.com/redhat-cop/osia.git@devel"
        export PATH="${HOME}/.local/bin:${PATH}"

        # Resolve the gitolite host from the gitolite-ssh secret annotation.
        GITOLITE_HOST=$(kubectl get secret gitolite-ssh -n "${NAMESPACE}" \
          -o jsonpath='{.metadata.annotations.tekton\.dev/git-0}')
        if [ -z "${GITOLITE_HOST}" ]; then
          echo "ERROR: Failed to read repository host from gitolite-ssh secret annotation"
          exit 1
        fi

        git config --global user.email ci-robot-account@redhat.com
        git config --global user.name "CI Robot"
        export GIT_SSH_COMMAND="ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"
        git clone "ssh://git@${GITOLITE_HOST}/cluster-management"

        # Run osia install
        cd cluster-management
        export AWS_SHARED_CREDENTIALS_FILE=aws-credentials.conf
        osia install \
          --verbose \
          --installer-version $(params.installer-version) \
          --cluster-name $(params.cluster-name) \
          --cloud aws \
          --cloud-env kua-aws \
          --master-flavor $(params.master-size) \
          --worker-flavor $(params.worker-size) \
          --list-of-regions $(params.region) \
          --installer-arch $(params.installer-arch) \
          --dns-provider route53

        # Get kubeconfig path (per-cluster, so parallel provisions don't clobber each other)
        cp /cluster-management/$(params.cluster-name)/auth/kubeconfig /workspace/shared-workspace/kubeconfig-$(params.cluster-name)
        export KUBECONFIG=/workspace/shared-workspace/kubeconfig-$(params.cluster-name)
        echo -n $KUBECONFIG | tee $(results.kubeconfig-path.path)

        # Extract the cluster API URL for a later kubectl-login
        KUBE_API=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
        echo -n $KUBE_API | tee $(results.kube-api.path)
  
        # Get OCP version from installers directory
        OCP_VERSION=$(ls -1 /cluster-management/installers | head -n 1)
        echo "OCP Version: $OCP_VERSION"
        echo -n $OCP_VERSION | tee $(results.ocp-version.path)
